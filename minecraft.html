<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft</title>
    <style>
        body{
            background-image: url();
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }
        .a{
            background-color: #e4caa9;
            border: 4px #373737;
            box-shadow: inset 4px 4px 0px;
            width: 80%;
            max-width: 600px;
            padding: 30px;
            color: #222222;
            text-align: center;
        }
        h1{
            margin-top: 0;
            color: #222222;
        }
    </style>
</head>
<body>
     <div   class="a">
            <h1>Minecraft Guia</h1>
            <p>Bem vindo</p>
     </div>
</body>
</html>
